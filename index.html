<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AR Experience</title>
    <!-- Tailwind CSS for modern glassmorphism UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- A-Frame WebXR Engine -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- A-Frame Extras for GLTF Animation Controller -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        background-color: #0b0d10; 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      }

      /* Ensure A-Frame Canvas stays behind the HTML landing UI */
      .a-canvas {
        z-index: 1 !important;
      }

      /* WebXR AR Mode UI Custom Placement */
      .a-enter-vr {
        bottom: 24px !important;
        right: 24px !important;
        z-index: 20 !important;
      }
    </style>
  </head>
  <body>

    <!-- Glassmorphism Landing Screen Overlay -->
    <div id="welcome-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-900 via-zinc-950 to-black transition-all duration-500 ease-in-out">
      <div class="w-[90%] max-w-sm rounded-3xl border border-white/10 bg-slate-900/75 p-8 text-center shadow-2xl backdrop-blur-xl">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h1 class="mb-2 text-xl font-semibold tracking-wide text-white">3D AR Experience</h1>
        <p class="mb-6 text-xs leading-relaxed text-zinc-400">
          Explore the synchronized character and diorama model in interactive AR space.
        </p>
        <button id="enterBtn" onclick="startExperience()" class="w-full rounded-xl bg-gradient-to-r from-emerald-600 to-green-500 py-3.5 text-sm font-semibold text-white shadow-lg shadow-emerald-900/40 transition-all hover:scale-[1.02] active:scale-[0.98]">
          Enter Experience
        </button>
      </div>
    </div>

    <!-- Viewer Framing Overlay -->
    <div id="viewerFrame" class="pointer-events-none fixed inset-4 z-10 hidden rounded-2xl border border-white/5"></div>

    <!-- A-Frame 3D/AR Scene -->
    <a-scene 
      webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay"
      vr-mode-ui="enabled: false"
      ar-mode-ui="enabled: true"
      renderer="colorManagement: true, physicallyCorrectLights"
      background="color: #0b0d10">
      
      <a-assets>
        <a-asset-item id="characterModel" src="./character.glb"></a-asset-item>
        <a-asset-item id="dioramaModel" src="./diorama.glb"></a-asset-item>
        <!-- Audio Preload -->
        <audio id="bgAudio" src="./audio.mp3" preload="auto" loop></audio>
      </a-assets>

      <!-- Lighting Setup -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.2" position="-1 2 1"></a-light>
      <a-light type="directional" color="#4CB5F5" intensity="0.4" position="1 -1 -1"></a-light>

      <!-- Camera position set to 4.5 distance for comfortable framing -->
      <a-camera position="0 1.5 4.5" look-controls="enabled: true"></a-camera>

      <!-- Shared AR Container -->
      <a-entity id="ar-container" position="0 0 0" scale="1 1 1">
        
        <!-- Animated Character Entity (starts paused, initialized via script) -->
        <a-entity 
          id="characterEntity"
          gltf-model="#characterModel" 
          position="0 0 0" 
          scale="1 1 1" 
          rotation="0 0 0">
        </a-entity>

        <!-- Environment Diorama Entity -->
        <a-entity 
          id="dioramaEntity"
          gltf-model="#dioramaModel" 
          position="0 0 0" 
          scale="1 1 1" 
          rotation="0 0 0">
        </a-entity>

      </a-entity>

    </a-scene>

    <!-- Synchronized Audio & Animation Logic -->
    <script>
      function startExperience() {
        const welcomeScreen = document.getElementById('welcome-screen');
        const viewerFrame = document.getElementById('viewerFrame');
        const characterEntity = document.getElementById('characterEntity');
        const audio = document.getElementById('bgAudio');

        // 1. Fade out overlay and reveal viewer frame
        welcomeScreen.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
          welcomeScreen.style.display = 'none';
        }, 500);
        viewerFrame.classList.remove('hidden');

        // 2. Play audio from frame 0
        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(err => {
            console.warn("Audio playback issue:", err);
          });
        }

        // 3. Simultaneously attach the animation component to trigger playback frame 0
        characterEntity.setAttribute('animation-mixer', {
          clip: '*',
          loop: 'repeat',
          timeScale: 1.0
        });
      }
    </script>
  </body>
</html>
