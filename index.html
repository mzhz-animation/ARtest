<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storybook Image Tracking AR</title>
    <!-- Include A-Frame and MindAR Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      /* Optional scan overlay prompt for kids */
      .scan-hint {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 999;
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <div class="scan-hint">📖 Point camera at the book page!</div>

    <!-- MindAR Scene Setup -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Preload your animated 3D GLB model -->
        <a-asset-item id="avatarModel" src="./test.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target index 0 matches the image inside targets.mind -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 3D Model anchored to page with scale, rotation, and autoplay animation -->
        <a-gltf-model 
          src="#avatarModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0" 
          animation-mixer>
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
