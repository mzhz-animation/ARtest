<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Showcase</title>
    <!-- A-Frame & Extras -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        background: #0d0f12; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      }

      /* Glassmorphism Frame Overlay */
      .viewer-frame {
        position: fixed;
        inset: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        box-sizing: border-box;
        z-index: 10;
      }

      .header-card {
        background: rgba(18, 20, 26, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 12px 20px;
        border-radius: 12px;
        pointer-events: auto;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        max-width: 320px;
      }
      .header-card h1 {
        margin: 0 0 4px 0;
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
      }
      .header-card p {
        margin: 0;
        font-size: 12px;
        color: #8b949e;
      }

      .footer-card {
        align-self: center;
        background: rgba(18, 20, 26, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 10px 20px;
        border-radius: 30px;
        pointer-events: auto;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .footer-card p {
        margin: 0;
        font-size: 12px;
        color: #c9d1d9;
      }
    </style>
  </head>
  <body>

    <!-- UI Overlay -->
    <div class="viewer-frame">
      <div class="header-card">
        <h1>Character & Diorama</h1>
        <p>Interactive 3D Pipeline Preview</p>
      </div>
      
      <div class="footer-card">
        <p>💡 Drag to rotate &nbsp;•&nbsp; Pinch to zoom</p>
      </div>
    </div>

    <!-- 3D Scene -->
    <a-scene background="color: #0d0f12" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights">
      
      <a-assets>
        <!-- Correct relative path to character.glb in root directory -->
        <a-asset-item id="avatarModel" src="./character.glb"></a-asset-item>
      </a-assets>

      <!-- Balanced Lights -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.2" position="-1 2 1"></a-light>
      <a-light type="directional" color="#4CB5F5" intensity="0.4" position="1 -1 -1"></a-light>

      <a-camera position="0 1.5 3" look-controls="enabled: true"></a-camera>

      <!-- 3D Model -->
      <a-entity 
        gltf-model="#avatarModel" 
        position="0 0 0" 
        scale="1 1 1" 
        rotation="0 0 0" 
        animation-mixer>
      </a-entity>

    </a-scene>

  </body>
</html>
