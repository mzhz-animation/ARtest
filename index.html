      /* Premium Framing UI Wrapper */
      .viewer-frame {

        inset: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);

        display: flex;
        flex-direction: column;

        box-sizing: border-box;
        z-index: 10;
      }

        pointer-events: auto;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        max-width: 320px;
      }

        margin: 0 0 4px 0;
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 0.3px;
      }
      .header-card p {
        margin: 0;
        font-size: 12px;
        color: #8b949e;
