<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storybook Image Tracking AR</title>
    <!-- Include A-Frame and MindAR Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        background: #000;
        font-family: sans-serif;
      }
      /* Full-screen tap overlay raised up by 20% to prevent bottom-bar cropping on modern phones */
      .ar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        z-index: 9999;
        cursor: pointer;
        padding: 20px 20px 80px 20px; /* Added extra bottom padding to lift content up */
        box-sizing: border-box;
      }
      .ar-overlay h2 {
        margin: 0 0 10px 0;
        font-size: 24px;
        color: #FF5722;
      }
      .ar-overlay p {
        margin: 0;
        font-size: 16px;
        opacity: 0.9;
      }
      /* Hide overlay once tapped */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>

    <!-- User Interaction Gate (Optimized for Galaxy S25 and iOS Safari) -->
    <div id="start-overlay" class="ar-overlay">
      <h2>📖 Storybook AR</h2>
      <p>Tap anywhere to start camera & scan book page!</p>
    </div>

    <!-- MindAR Scene Setup -->
    <a-scene 
      id="ar-scene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Preload your animated 3D GLB model -->
        <a-asset-item id="avatarModel" src="./test.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target index 0 matches your compiled book page inside targets.mind -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 3D Model anchored to page with scale, rotation, and looping animation -->
        <a-gltf-model 
          src="#avatarModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0" 
          animation-mixer>
        </a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
      // Script to handle user tap, remove the overlay, and safely boot up MindAR
      const overlay = document.querySelector('#start-overlay');
      const scene = document.querySelector('#ar-scene');

      overlay.addEventListener('click', () => {
        overlay.classList.add('hidden');
        
        // Explicitly start the MindAR system after user interaction
        const mindarSystem = scene.systems["mindar-image-system"];
        if (mindarSystem) {
          mindarSystem.start();
        }
      });
    </script>
  </body>
</html>
