<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character & Diorama Showcase</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        background: #0b0d10; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      }

      /* Landing Page / Framing Overlay */
      #welcome-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #161b22 0%, #0b0d10 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      .welcome-card {
        background: rgba(22, 27, 34, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        max-width: 360px;
        width: 90%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      .welcome-card h1 {
        margin: 0 0 8px 0;
        font-size: 22px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 0.5px;
      }

      .welcome-card p {
        margin: 0 0 24px 0;
        font-size: 13px;
        color: #8b949e;
        line-height: 1.5;
      }

      .enter-btn {
        background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
        color: white;
        border: none;
        padding: 14px 28px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
        width: 100%;
      }

      .enter-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(46, 160, 67, 0.6);
      }

      /* Subtle corner framing lines when viewing 3D */
      .viewer-frame {
        position: fixed;
        inset: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        pointer-events: none;
        z-index: 10;
        display: none;
      }
    </style>
  </head>
  <body>

    <!-- Landing / Entry UI Screen -->
    <div id="welcome-screen">
      <div class="welcome-card">
        <h1>3D Interactive Viewer</h1>
        <p>Explore the character and environment model in real-time 3D space.</p>
        <button class="enter-btn" onclick="startExperience()">Enter Experience</button>
      </div>
    </div>

    <!-- Framing Border (Appears after clicking enter) -->
    <div class="viewer-frame" id="viewerFrame"></div>

    <!-- A-Frame 3D Scene (Loads character.glb and diorama.glb separately) -->
    <a-scene background="color: #0b0d10" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights">
      
      <a-assets>
        <a-asset-item id="characterModel" src="./character.glb"></a-asset-item>
        <a-asset-item id="dioramaModel" src="./diorama.glb"></a-asset-item>
      </a-assets>

      <!-- Balanced 3-Point Lighting -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.2" position="-1 2 1"></a-light>
      <a-light type="directional" color="#4CB5F5" intensity="0.4" position="1 -1 -1"></a-light>

      <!-- Camera pulled back further (Z = 4.5) for a wider, comfortable framing -->
      <a-camera position="0 1.5 4.5" look-controls="enabled: true"></a-camera>

      <!-- 1st Model: Character with Animation -->
      <a-entity 
        gltf-model="#characterModel" 
        position="0 0 0" 
        scale="1 1 1" 
        rotation="0 0 0" 
        animation-mixer="loop: repeat">
      </a-entity>

      <!-- 2nd Model: Diorama Background (Loads with its own clean textures!) -->
      <a-entity 
        gltf-model="#dioramaModel" 
        position="0 0 0" 
        scale="1 1 1" 
        rotation="0 0 0">
      </a-entity>

    </a-scene>

    <!-- Script to hide landing page and reveal full-screen viewer -->
    <script>
      function startExperience() {
        const welcomeScreen = document.getElementById('welcome-screen');
        const viewerFrame = document.getElementById('viewerFrame');
        
        welcomeScreen.style.opacity = '0';
        welcomeScreen.style.visibility = 'hidden';
        viewerFrame.style.display = 'block';
      }
    </script>
  </body>
</html>
