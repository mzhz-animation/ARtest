<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AR Character Showcase</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        background: #0b0d10; 
      }
    </style>
  </head>
  <body>

    <!-- A-Frame Scene configured strictly for AR (VR button completely disabled/hidden) -->
    <a-scene 
      webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay"
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true, physicallyCorrectLights"
      ar-mode-ui="enabled: true">
      
      <a-assets>
        <a-asset-item id="characterModel" src="./character.glb"></a-asset-item>
        <a-asset-item id="dioramaModel" src="./diorama.glb"></a-asset-item>
        <!-- Background Audio Asset -->
        <audio id="bgAudio" src="./audio.mp3" preload="auto" loop></audio>
      </a-assets>

      <!-- Balanced 3-Point Lighting -->
      <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.2" position="-1 2 1"></a-light>

      <!-- Standard Camera Setup -->
      <a-camera position="0 1.5 4.5"></a-camera>

      <!-- 
        Container Entity for AR Scaling: 
        In AR mode, if models look too big, lowering the parent scale or adjusting position 
        keeps them anchored comfortably in the real-world camera space.
      -->
      <a-entity id="ar-container" position="0 0 0" scale="1 1 1">
        
        <!-- 1st Model: Character with Animation -->
        <a-entity 
          gltf-model="#characterModel" 
          position="0 0 0" 
          scale="1 1 1" 
          animation-mixer="loop: repeat">
        </a-entity>

        <!-- 2nd Model: Diorama Environment -->
        <a-entity 
          gltf-model="#dioramaModel" 
          position="0 0 0" 
          scale="1 1 1">
        </a-entity>

      </a-entity>

    </a-scene>

    <!-- Script to handle automatic audio playback on first touch/interaction -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('bgAudio');
        
        // Browsers require user interaction to start audio. 
        // This triggers the audio seamlessly on the very first screen tap/click.
        const startAudio = () => {
          if (audio && audio.paused) {
            audio.play().catch(e => console.log("Audio autoplay blocked:", e));
          }
          window.removeEventListener('click', startAudio);
          window.removeEventListener('touchstart', startAudio);
        };

        window.addEventListener('click', startAudio);
        window.addEventListener('touchstart', startAudio);
      });
    </script>
  </body>
</html>
