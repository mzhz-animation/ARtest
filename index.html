<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character & Diorama Showcase</title>
    <!-- A-Frame & A-Frame Extras -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        background: #0b0d10; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      }

      /* Fullscreen Landing Screen Overlay */
      #welcome-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #161b22 0%, #0b0d10 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      .welcome-card {
        background: rgba(22, 27, 34, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        max-width: 360px;
        width: 90%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      .welcome-card h1 {
        margin: 0 0 8px 0;
        font-size: 22px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 0.5px;
      }

      .welcome-card p {
        margin: 0 0 24px 0;
        font-size: 13px;
        color: #8b949e;
        line-height: 1.5;
      }

      .enter-btn {
        background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
        color: white;
        border: none;
        padding: 14px 28px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
        width: 100%;
      }

      .enter-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(46, 160, 67, 0.6);
      }

      .viewer-frame {
        position: fixed;
        inset: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        pointer-events: none;
        z-index: 10;
        display: none;
      }
    </style>
  </head>
  <body>

    <!-- Landing Screen with Trigger Button -->
    <div id="welcome-screen">
      <div class="welcome-card">
        <h1>3D Interactive Viewer</h1>
        <p>Click below to launch the experience with synchronized audio and animation.</p>
        <button class="enter-btn" onclick="startExperience()">Enter Experience</button>
      </div>
    </div>

    <!-- Subtle framing outline during viewing -->
    <div class="viewer-frame" id="viewerFrame"></div>

    <!-- 3D Scene Configured for AR -->
    <a-scene 
      webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay"
      vr-mode-ui="enabled: false"
      ar-mode-ui="enabled: true"
      background="color: #0b0d10" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights">
      
      <a-assets>
        <a-asset-item id="characterModel" src="./character.glb"></a-asset-item>
        <a-asset-item id="dioramaModel" src="./diorama.glb"></a-asset-item>
        <audio id="bgAudio" src="./audio.mp3" preload="none" loop></audio>
      </a-assets>

      <!-- Balanced Lighting -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.2" position="-1 2 1"></a-light>
      <a-light type="directional" color="#4CB5F5" intensity="0.4" position="1 -1 -1"></a-light>

      <!-- Camera pulled back for optimal framing -->
      <a-camera position="0 1.5 4.5" look-controls="enabled: true"></a-camera>

      <!-- Parent AR Container -->
      <a-entity id="ar-container" position="0 0 0" scale="1 1 1">
        
        <!-- 1st Model: Character (Animation starts ONLY via script) -->
        <a-entity 
          id="characterEntity"
          gltf-model="#characterModel" 
          position="0 0 0" 
          scale="1 1 1" 
          rotation="0 0 0">
        </a-entity>

        <!-- 2nd Model: Diorama Environment -->
        <a-entity 
          gltf-model="#dioramaModel" 
          position="0 0 0" 
          scale="1 1 1" 
          rotation="0 0 0">
        </a-entity>

      </a-entity>

    </a-scene>

    <!-- Synchronized Audio & Animation Trigger Script -->
    <script>
      function startExperience() {
        // 1. Hide the landing overlay screen
        const welcomeScreen = document.getElementById('welcome-screen');
        const viewerFrame = document.getElementById('viewerFrame');
        
        welcomeScreen.style.opacity = '0';
        welcomeScreen.style.visibility = 'hidden';
        viewerFrame.style.display = 'block';

        // 2. Play audio from the beginning
        const audio = document.getElementById('bgAudio');
        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(error => {
            console.log("Audio play error:", error);
          });
        }

        // 3. Attach animation-mixer to character at exact same time
        const character = document.getElementById('characterEntity');
        if (character) {
          character.setAttribute('animation-mixer', 'loop: repeat; timeScale: 1.0');
        }
      }
    </script>
  </body>
</html>
